services:
  postgres:
    # Postgres 18 changed PGDATA to /var/lib/postgresql/18/docker and moved
    # the declared volume to /var/lib/postgresql, so mount the parent dir.
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: iron_defer
      POSTGRES_PASSWORD: iron_defer
      POSTGRES_DB: iron_defer
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iron_defer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
